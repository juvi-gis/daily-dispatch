{% extends "newsroom/base.html" %}
{% block title %}Publisher{% endblock %}
{% block content %}
<div class="col-md-8 mx-auto">
  <h1 class="h3 mb-3">{% if object %}Edit publisher{% else %}New publisher{% endif %}</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" href="{% url 'publisher_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
