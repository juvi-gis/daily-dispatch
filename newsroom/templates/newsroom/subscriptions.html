{% extends "newsroom/base.html" %}
{% block title %}My subscriptions{% endblock %}
{% block content %}
<div class="col-md-8 mx-auto">
  <h1 class="h3 mb-3">My subscriptions</h1>
  <p>New articles from anything you tick are emailed to you once an editor approves them.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Save subscriptions</button>
  </form>
</div>
{% endblock %}
